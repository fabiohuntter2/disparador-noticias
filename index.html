<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantão de notícias | Huntter News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#0f5bd8; --azul-escuro:#0a3f9c; --vermelho:#d7261e;
    --texto:#1b2333; --suave:#5d6779; --linha:#e3e8f0; --fundo:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fundo);color:var(--texto);
    font:400 15px/1.45 Barlow,"Segoe UI",Roboto,Arial,sans-serif}
  .topo{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--azul);color:#fff;padding:10px 14px;border-bottom:3px solid var(--vermelho)}
  .topo h1{margin:0;font:700 22px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.3px}
  .status{display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap;opacity:.95}
  .ponto{width:9px;height:9px;border-radius:50%;background:#ff4a3d;box-shadow:0 0 0 0 rgba(255,74,61,.7);
    animation:pulso 2s infinite}
  @keyframes pulso{70%{box-shadow:0 0 0 7px rgba(255,74,61,0)}100%{box-shadow:0 0 0 0 rgba(255,74,61,0)}}
  @media (prefers-reduced-motion:reduce){.ponto{animation:none}}
  .filtros{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--linha);overflow-x:auto}
  .filtros button{font:500 14px Barlow,sans-serif;border:1px solid var(--linha);background:#fff;color:var(--texto);
    padding:5px 13px;border-radius:999px;cursor:pointer}
  .filtros button[aria-pressed="true"]{background:var(--azul-escuro);border-color:var(--azul-escuro);color:#fff}
  .filtros button:focus-visible,a:focus-visible{outline:2px solid var(--vermelho);outline-offset:2px}
  ul{list-style:none;margin:0;padding:0}
  li a{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:12px 14px;border-bottom:1px solid var(--linha);
    color:inherit;text-decoration:none}
  li a:hover h2{color:var(--azul)}
  .foto{width:104px;aspect-ratio:4/3;border-radius:4px;object-fit:cover;background:#dfe6f2}
  .sem-foto{display:flex;align-items:center;justify-content:center;color:var(--azul);
    font:700 18px "Barlow Condensed",sans-serif}
  .meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--suave);margin-bottom:3px}
  .fonte{font-weight:500;color:var(--vermelho)}
  .fonte.imirante{color:var(--azul)}
  h2{margin:0;font:600 18px/1.2 "Barlow Condensed","Arial Narrow",sans-serif}
  p{margin:4px 0 0;color:var(--suave);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .aviso{padding:28px 16px;text-align:center;color:var(--suave)}
  @media (max-width:420px){li a{grid-template-columns:80px 1fr}.foto{width:80px}p{display:none}}
</style>
</head>
<body>
  <header class="topo">
    <h1>Plantão de notícias</h1>
    <span class="status"><span class="ponto" aria-hidden="true"></span><span id="hora">Carregando</span></span>
  </header>
  <nav class="filtros" aria-label="Filtrar notícias">
    <button type="button" data-grupo="" aria-pressed="true">Todas</button>
    <button type="button" data-grupo="Maranhão" aria-pressed="false">Maranhão</button>
    <button type="button" data-grupo="Brasil" aria-pressed="false">Brasil</button>
  </nav>
  <ul id="lista"></ul>

<script>
  const params = new URLSearchParams(location.search);
  const LIMITE = parseInt(params.get("limite") || "15", 10);
  let grupo = params.get("grupo") || "";
  let dados = [];

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function tempo(iso){
    const min = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
    if (min < 1) return "agora";
    if (min < 60) return `há ${min} min`;
    const h = Math.round(min / 60);
    if (h < 24) return `há ${h} h`;
    return new Date(iso).toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"});
  }

  function desenhar(){
    document.querySelectorAll(".filtros button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.grupo === grupo)));
    const lista = dados.filter(n => !grupo || n.grupo === grupo).slice(0, LIMITE);
    const ul = document.getElementById("lista");
    if (!lista.length){
      ul.innerHTML = `<li class="aviso">As primeiras notícias aparecem aqui após a próxima rodada do disparador.</li>`;
      return;
    }
    ul.innerHTML = lista.map(n => {
      const foto = n.imagem
        ? `<img class="foto" src="${esc(n.imagem)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=&quot;foto sem-foto&quot;>HN</span>'">`
        : `<span class="foto sem-foto">HN</span>`;
      const classe = /imirante/i.test(n.fonte) ? "fonte imirante" : "fonte";
      return `<li><a href="${esc(n.link)}" target="_blank" rel="noopener">
        ${foto}
        <div>
          <div class="meta"><span class="${classe}">${esc(n.fonte)}</span><span>${tempo(n.data)}</span></div>
          <h2>${esc(n.titulo)}</h2>
          ${n.resumo ? `<p>${esc(n.resumo)}</p>` : ""}
        </div></a></li>`;
    }).join("");
  }

  async function carregar(){
    try{
      const r = await fetch("noticias.json?t=" + Date.now(), {cache:"no-store"});
      const j = await r.json();
      dados = j.noticias || [];
      document.getElementById("hora").textContent = j.atualizado
        ? "Atualizado às " + new Date(j.atualizado).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"})
        : "Aguardando a primeira rodada";
    }catch(e){
      document.getElementById("hora").textContent = "Sem conexão, tentando de novo";
    }
    desenhar();
  }

  document.querySelectorAll(".filtros button").forEach(b =>
    b.addEventListener("click", () => { grupo = b.dataset.grupo; desenhar(); }));

  carregar();
  setInterval(carregar, 10 * 60 * 1000);
</script>
</body>
</html>
